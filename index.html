<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Upkeep" />
    <meta name="theme-color" content="#1d3a2c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Upkeep — Home Care</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Hanken Grotesk', system-ui, sans-serif;
        background: #efece4;
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      @media (max-width: 760px) {
        /* 16px stops iOS from zooming in when a field is focused */
        input, select, textarea { font-size: 16px !important; }
        button { min-height: 36px; min-width: 36px; }
        body { -webkit-tap-highlight-color: rgba(29,58,44,0.08); }
      }
      ::-webkit-scrollbar-thumb { background: #cbc5bb; border-radius: 9999px; border: 2px solid #efece4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
